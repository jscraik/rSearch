name: Robin advisory pilot

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  robin:
    # Manual reviews only; Workers AI uses the account's shared free allowance.
    # Cloudflare can bill overage on the paid plan.
    if: ${{ github.event.issue.pull_request && github.event.comment.user.login == 'jscraik' && github.event.comment.body == '/robin' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch pinned Robin action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: antongulin/robin
          ref: c96f54a4abd07090f37aefa3f9654b489808389c
          path: .robin-pilot-action
          persist-credentials: false
      - name: Preserve existing review decisions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = '.robin-pilot-action/dist/index.js';
          const invocation = 'await this.dismissStaleRobinReviews(owner, repo, pullNumber, review.id);';
          const dispatch = '    async dispatch(request, record, signal) {';
          const sdkRetries = '            maxRetries: 0,';
          const sdkRequest = '        const req = {\n            method,\n            ...(body && { body: body }),';
          const source = fs.readFileSync(file, 'utf8');
          if ([invocation, dispatch, sdkRetries, sdkRequest].some((marker) => source.split(marker).length !== 2)) {
            throw new Error('Robin action did not match the pinned advisory and request-limit patch');
          }
          // SDK retries are disabled in the pinned action. Count at dispatch so
          // compatibility, empty-response and outer retries share one limit;
          // reject redirects so one dispatch cannot send a second HTTP request.
          const boundedDispatch = `${dispatch}\n        if (globalThis.__rsearchRobinPilotRequestSent) throw new Error('Robin pilot permits only one provider request per run');\n        globalThis.__rsearchRobinPilotRequestSent = true;`;
          const boundedRequest = sdkRequest.replace('            method,', "            method,\n            redirect: 'error',");
          fs.writeFileSync(file, source
            .replace(invocation, '/* Advisory pilot: leave existing reviews unchanged. */')
            .replace(dispatch, boundedDispatch)
            .replace(sdkRequest, boundedRequest));
          NODE
      - name: Advisory diff review
        uses: ./.robin-pilot-action
        with:
          github-token: ${{ github.token }}
          llm-api-key: ${{ secrets.ROBIN_CLOUDFLARE_API_TOKEN }}
          llm-base-url: ${{ secrets.ROBIN_CLOUDFLARE_BASE_URL }}
          model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
          agent-mode: "off"
          request-changes: "false"
          fail-on-high: "false"
          max-diff-size: "30000"
          estimated-request-token-budget: "12000"
          max-output-tokens: "1500"
          min-command-permission: "write"
          llm-timeout-ms: "120000"
